# Chùa Online — Docker
#   Chỉ server (OBS ở máy khác qua SSH tunnel):   docker compose up -d --build
#   + HTTPS cho điện thoại (cần DOMAIN trong .env): docker compose --profile https up -d --build
#   + VPS tự phát RTMP 24/7 (cần STREAM_KEY):       docker compose --profile stream up -d --build
name: chua-online

x-env: &env
  env_file:
    - path: .env
      required: false

services:
  # Server: nghe TikTok Live, chạy game Đoán từ, phục vụ /doantu, /admin
  app:
    <<: *env
    build: { context: ., target: app }
    image: chua-online:app
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8686"
      REQUIRE_ADMIN_TOKEN: "1"
    ports:
      - "127.0.0.1:8686:8686"   # chỉ mở trong VPS; ra internet qua Caddy (HTTPS)
    volumes:
      - ./data:/app/data                          # kho từ, điểm tuần, cache thuộc tính, giọng MC — thư mục data/ ngay trên VPS (giữ khi cập nhật)
      - ./config.json:/app/config.json:ro         # sửa config.json rồi: docker compose restart app
      - ./public/assets:/app/public/assets:ro     # ảnh nền, âm thanh riêng

  # Gateway nền tảng nhiều game: TikTok đa kênh → WebSocket → overlay /o/<key>, dashboard /app, trang chủ
  # (cùng image với app, chỉ khác lệnh chạy). Ra internet qua Caddy ở PLAY_DOMAIN (mặc định play.<DOMAIN>).
  gateway:
    <<: *env
    image: chua-online:app
    restart: unless-stopped
    command: ["node", "gateway/index.js"]
    environment:
      HOST: 0.0.0.0
      GATEWAY_PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # HTTPS tự động (Let's Encrypt). DOMAIN: tên miền riêng hoặc <ip-gạch-ngang>.sslip.io
  caddy:
    image: caddy:2.8.4-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [app, gateway]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      PLAY_DOMAIN: ${PLAY_DOMAIN:-play.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Máy phát 24/7: Chromium ẩn hiển thị chánh điện -> ffmpeg -> RTMP TikTok
  streamer:
    <<: *env
    build: { context: ., target: streamer }
    image: chua-online:streamer
    profiles: [stream]
    restart: unless-stopped
    depends_on: [app]
    environment:
      PAGE_URL: http://app:8686/${PAGE:-doantu}?phone=0
      CHROME_FLAGS: --no-sandbox
    shm_size: 1gb

volumes:
  chua-data:   # chỗ lưu cũ — remote-deploy.sh tự chép sang ./data, giữ lại làm bản dự phòng
  caddy-data:
  caddy-config:
