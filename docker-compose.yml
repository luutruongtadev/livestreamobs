services:
  # Server: nghe TikTok Live, tính công đức, phục vụ overlay + trang admin
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # chạy root để ghi được thư mục ./data trên VPS
    user: "0:0"
    environment:
      HOST: 0.0.0.0
    # Chỉ mở trên localhost của VPS. Vào admin qua SSH tunnel (xem README).
    ports:
      - "127.0.0.1:8686:8686"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
      - ./public/assets:/app/public/assets:ro

  # Máy phát: Chromium ẩn hiển thị overlay -> ffmpeg -> RTMP TikTok
  streamer:
    build: .
    restart: unless-stopped
    depends_on: [app]
    env_file:
      - path: .env
        required: false
    environment:
      PAGE_URL: http://app:8686/${PAGE:-chanhdien}?debug=0
      CHROME_FLAGS: --no-sandbox
    shm_size: 1gb
    command: ["bash", "deploy/stream.sh"]
