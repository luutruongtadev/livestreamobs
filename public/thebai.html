<!doctype html>
<html lang="vi" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b14">
  <link rel="icon" href="assets/icon-192.png">
  <title>Kho thẻ Thần Thú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0d0b14; --panel: #17131f; --line: #2c2538; --fg: #efe9f7; --muted: #a69cb8; --gold: #f5c542; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 500 15px/1.5 'Be Vietnam Pro', system-ui, sans-serif;
      padding: 20px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
    main { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    h1 { font: 400 28px 'Bungee', sans-serif; color: var(--gold); margin: 0; }
    h2 { font: 800 13px 'Be Vietnam Pro', sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
    .lede { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
    form { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; font: 600 16px 'Be Vietnam Pro', sans-serif; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    button { font: 800 15px 'Be Vietnam Pro', sans-serif; color: #1a1405; background: var(--gold); border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .who { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .who img, .who .ph { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; background: #2a2236; display: grid; place-items: center; font-weight: 900; }
    .who b { font-size: 20px; }
    .stats { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-weight: 700; }
    .bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; max-width: 320px; }
    .bar i { display: block; height: 100%; background: #a78bfa; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .grid canvas { width: 100%; height: auto; display: block; }
    .cell { display: flex; flex-direction: column; gap: 6px; }
    .cell small { color: var(--muted); text-align: center; font-weight: 700; }
    .pick { color: #3ddc97 !important; }
    .top { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
    .top div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 8px; cursor: pointer; }
    .top div:hover { border-color: var(--gold); }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <div>
    <h1>⚔ Kho thẻ Thần Thú</h1>
    <p class="lede">Thẻ bạn nhặt được trong Đấu Trường Thần Thú trên live. Gõ tên TikTok để xem bộ sưu tập: mỗi lá có độ hiếm, phẩm chất (số sao) và số seri riêng.</p>
  </div>
  <form id="f"><input id="q" placeholder="Tên TikTok của bạn…" autocomplete="off" aria-label="Tên TikTok"><button>Xem</button></form>
  <div id="out"></div>
  <section><h2>🏆 Vua đấu trường</h2><div id="top" class="top"></div></section>
  <section><h2>💎 Bộ sưu tập giá trị nhất</h2><div id="col" class="top"></div></section>
</main>
<script type="module">
  import { CARDS, CARD_BY_ID, RARITIES, stars } from './js/cards-data.js';
  import { drawCard, CARD_W, CARD_H } from './js/cardart.js';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const live = [];
  function cardCanvas(inst, owner, dim = false) {
    const c = document.createElement('canvas');
    const w = 300; c.width = w; c.height = Math.round(w * CARD_H / CARD_W);
    const x = c.getContext('2d');
    const draw = (t) => { x.clearRect(0, 0, c.width, c.height); x.save(); if (dim) x.filter = 'grayscale(1) brightness(.35)'; drawCard(x, inst, w / 2, c.height / 2, w * 0.94, { t, owner, glow: false }); x.restore(); };
    draw(0);
    if (!dim && RARITIES[CARD_BY_ID[inst.card].rar].rank >= 2) live.push(draw);
    return c;
  }
  (function loop(now) { for (const d of live) d(now / 1000); requestAnimationFrame(loop); })(0);

  function render(p) {
    live.length = 0;
    const out = $('out'); out.innerHTML = '';
    const head = document.createElement('div'); head.className = 'panel';
    const best = new Map();
    for (const c of p.cards) if (!best.has(c.card)) best.set(c.card, c);
    head.innerHTML = `<div class="who">${p.avatar ? `<img src="${esc(p.avatar)}" referrerpolicy="no-referrer" alt="">` : `<span class="ph">${esc([...p.name][0] || '?')}</span>`}
      <div><b>${esc(p.name)}</b><div class="stats"><span>🎴 ${p.cards.length} thẻ</span><span>🐾 ${best.size}/${CARDS.length} loài</span><span>🏆 ${p.wins} thắng</span><span>💀 ${p.kills} mạng</span><span>⚔️ ${p.games} trận</span></div></div></div>
      <div style="margin-top:12px"><div class="stats"><span>🧩 ${p.shards}/${p.chestEvery} mảnh tới rương kế tiếp</span></div><div class="bar"><i style="width:${Math.min(100, p.shards / p.chestEvery * 100)}%"></i></div></div>`;
    out.append(head);
    const s1 = document.createElement('section'); s1.innerHTML = '<h2 style="margin-top:20px">Bộ sưu tập theo loài</h2>';
    const g1 = document.createElement('div'); g1.className = 'grid';
    for (const d of CARDS) {
      const cell = document.createElement('div'); cell.className = 'cell';
      const inst = best.get(d.id);
      cell.append(cardCanvas(inst || { card: d.id, q: 60, serial: 0 }, inst ? '' : '', !inst));
      const sm = document.createElement('small');
      sm.textContent = inst ? `${RARITIES[d.rar].name} · ${p.cards.filter((c) => c.card === d.id).length} lá` : `??? · ${RARITIES[d.rar].name}`;
      cell.append(sm); g1.append(cell);
    }
    s1.append(g1); out.append(s1);
    const s2 = document.createElement('section'); s2.innerHTML = `<h2 style="margin-top:20px">Tất cả ${p.cards.length} lá (mạnh nhất trước)</h2>`;
    const g2 = document.createElement('div'); g2.className = 'grid';
    for (const c of p.cards) {
      const cell = document.createElement('div'); cell.className = 'cell';
      cell.append(cardCanvas(c, p.name));
      const sm = document.createElement('small');
      sm.textContent = `${'★'.repeat(stars(c.q))} ${c.q}% · #${String(c.serial).padStart(4, '0')}`;
      if (c.uid === p.pick) { sm.textContent += ' · đang ra trận'; sm.className = 'pick'; }
      cell.append(sm); g2.append(cell);
    }
    s2.append(g2); out.append(s2);
  }

  async function search(q) {
    if (!q) return;
    history.replaceState(null, '', '?q=' + encodeURIComponent(q));
    const r = await fetch('/api/arena/collection?q=' + encodeURIComponent(q)).then((x) => x.json()).catch(() => ({ players: [] }));
    if (!r.players.length) { live.length = 0; $('out').innerHTML = `<p class="empty">Chưa thấy "${esc(q)}". Vào live, comment <b>vào</b> để nhận thẻ khởi đầu nhé!</p>`; return; }
    if (r.players.length > 1 && r.players[0].name.toLowerCase() !== q.toLowerCase()) {
      live.length = 0;
      $('out').innerHTML = '<p class="empty">Có nhiều người trùng, chọn tên của bạn:</p><div class="top">' + r.players.map((p, i) => `<div data-i="${i}"><b>${esc(p.name)}</b><span>${p.cards.length} thẻ</span></div>`).join('') + '</div>';
      $('out').querySelectorAll('[data-i]').forEach((el) => (el.onclick = () => render(r.players[el.dataset.i])));
      return;
    }
    render(r.players[0]);
  }
  $('f').onsubmit = (e) => { e.preventDefault(); search($('q').value.trim()); };
  const row = (p, right) => { const e = p.best ? CARD_BY_ID[p.best.card]?.emoji || '' : ''; return `<div data-n="${esc(p.name)}"><b>${esc(p.name)} ${e}</b><span>${right}</span></div>`; };
  fetch('/api/arena/top').then((r) => r.json()).then((r) => {
    $('top').innerHTML = r.wins.map((p, i) => row(p, `${i < 3 ? ['👑', '🥈', '🥉'][i] : '#' + (i + 1)} ${p.wins} thắng`)).join('') || '<p class="empty">Chưa có ai thắng.</p>';
    $('col').innerHTML = r.collectors.map((p) => row(p, `${p.total} thẻ`)).join('') || '<p class="empty">Chưa có thẻ nào.</p>';
    document.querySelectorAll('[data-n]').forEach((el) => (el.onclick = () => { $('q').value = el.dataset.n; search(el.dataset.n); }));
  }).catch(() => {});
  const q0 = new URLSearchParams(location.search).get('q');
  if (q0) { $('q').value = q0; search(q0); }
</script>
</body>
</html>
