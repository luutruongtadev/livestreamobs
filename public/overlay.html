<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chùa Online — Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=Noto+Serif:wght@700;900&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }
    #sound {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      font: 600 16px 'Be Vietnam Pro', system-ui, sans-serif; color: #fff;
      background: rgba(120, 20, 10, .85); border: 2px solid #f5c542; border-radius: 999px;
      padding: 10px 20px; cursor: pointer; display: none;
    }
  </style>
</head>
<body>
  <canvas id="c" width="1080" height="1920"></canvas>
  <button id="sound">🔔 Bấm để bật âm thanh</button>
  <script type="module" src="js/overlay.js"></script>
</body>
</html>
