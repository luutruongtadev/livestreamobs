<!doctype html>
<html lang="vi" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giải mã câu bí ẩn</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0: #070a1f; --bg1: #141a4a; --panel: rgba(20, 24, 66, .78); --line: rgba(129, 140, 248, .35);
    --ink: #eef2ff; --muted: #a5b4fc; --gold: #fbbf24; --gold2: #f59e0b; --teal: #2dd4bf; --green: #4ade80; --pink: #f472b6;
    --font: 'Be Vietnam Pro', system-ui, sans-serif; --emoji: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg0); overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; color: var(--ink); font-family: var(--font);
    background: radial-gradient(ellipse at 50% 18%, #2b2a7a 0%, #141a4a 45%, #070a1f 100%); }
  /* nền xanh (chroma key) cho OBS: /giaima?bg=green · trong suốt: /giaima?bg=none */
  #stage.green { background: #00b140; }
  #stage.none { background: transparent; }
  #stage.none .panel { background: rgba(10, 12, 40, .82); }

  /* ---------- thanh trên ---------- */
  #top { position: absolute; left: 40px; right: 40px; top: 46px; height: 96px; display: flex; align-items: center; gap: 18px; }
  #logo { font-size: 50px; font-weight: 900; letter-spacing: 1px; line-height: 1; white-space: nowrap;
    background: linear-gradient(180deg, #fff7d6, #fbbf24 60%, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
  #logo .lock { font-family: var(--emoji); -webkit-text-fill-color: initial; color: initial; margin-right: 6px; }
  #kind { padding: 8px 18px; border-radius: 999px; background: rgba(251, 191, 36, .16); border: 2px solid rgba(251, 191, 36, .55); color: #fde68a; font-size: 26px; font-weight: 800; white-space: nowrap; }
  #round { color: var(--muted); font-size: 24px; font-weight: 700; white-space: nowrap; }
  #timer { margin-left: auto; min-width: 170px; padding: 0 22px; box-sizing: border-box; height: 76px; border-radius: 38px; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: rgba(0,0,0,.35); border: 3px solid var(--line); font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #timer.low { border-color: #f87171; color: #fecaca; animation: pulse 1s ease-in-out infinite; }

  /* phần chính xếp dọc: câu bí ẩn → gợi ý → tim / quà / bảng cao thủ (phần cuối có thể bị cắt nếu quá dài) */
  #main { position: absolute; left: 30px; right: 30px; top: 168px; bottom: 24px; display: flex; flex-direction: column; gap: 34px; }
  .panel { position: relative; flex: none; background: var(--panel); border: 2px solid var(--line); border-radius: 34px; box-shadow: 0 18px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); }

  /* ---------- câu bí ẩn ---------- */
  #phrase { min-height: 380px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 34px 20px 18px; box-sizing: border-box; }
  #phraseTitle { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); padding: 6px 22px; border-radius: 999px; font-size: 22px; font-weight: 800; letter-spacing: 3px;
    background: linear-gradient(90deg, #6366f1, #a855f7); color: #fff; white-space: nowrap; box-shadow: 0 6px 18px rgba(99,102,241,.45); }
  #lines { display: flex; flex-direction: column; align-items: center; gap: var(--lg, 14px); }
  .line { display: flex; justify-content: center; gap: var(--wg, 30px); }
  .word { display: flex; gap: var(--cg, 6px); }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hex { position: relative; width: var(--w); height: calc(var(--w) * 1.1); clip-path: polygon(50% 0, 100% 24%, 100% 76%, 50% 100%, 0 76%, 0 24%);
    background: linear-gradient(180deg, #8b8cff, #5b4fd6); display: grid; place-items: center; }
  .hex::before { content: ''; position: absolute; inset: calc(var(--w) * .07); clip-path: inherit; background: linear-gradient(180deg, #23215e, #15133f); }
  .hex b { position: relative; font-size: calc(var(--w) * .56); font-weight: 900; line-height: 1; color: #2b1700; }
  .cell.open .hex { background: linear-gradient(180deg, #fff3c4, #f59e0b); }
  .cell.open .hex::before { background: linear-gradient(180deg, #fde68a, #fbbf24); }
  .cell.pop .hex { animation: pop .7s cubic-bezier(.2, 1.6, .4, 1); }
  .cell.flash .hex { animation: glow 1.4s ease-out; }
  .num { font-size: max(17px, calc(var(--w) * .3)); min-height: calc(var(--w) * .34); font-weight: 800; color: #c7d2fe; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .cell.open .num { color: rgba(199, 210, 254, .55); }
  .cell.flash .num { color: var(--gold); text-shadow: 0 0 12px rgba(251,191,36,.9); }
  #howto { margin-top: 16px; font-size: 25px; font-weight: 700; color: #c7d2fe; text-align: center; }
  #howto b { color: #fde68a; }

  /* ---------- gợi ý ---------- */
  #clues { padding: 28px 18px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
  #cluesTitle { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); padding: 6px 22px; border-radius: 999px; font-size: 22px; font-weight: 800; letter-spacing: 3px;
    background: linear-gradient(90deg, #0ea5e9, #14b8a6); color: #fff; white-space: nowrap; box-shadow: 0 6px 18px rgba(20,184,166,.4); }
  .clue { position: relative; display: flex; align-items: center; gap: 16px; padding: 8px 14px; border-radius: 22px; background: rgba(255,255,255,.04); border: 2px solid transparent; transition: background .4s, border-color .4s; }
  .clue.solved { background: rgba(74, 222, 128, .1); border-color: rgba(74, 222, 128, .55); }
  .clue.auto { background: rgba(148, 163, 184, .08); border-color: rgba(148, 163, 184, .3); }
  .clue.pop { animation: rowpop .9s ease-out; }
  .clue .emo { flex: none; width: var(--ew, 92px); height: var(--ew, 92px); border-radius: 22px; display: grid; place-items: center; background: rgba(255,255,255,.08);
    font-family: var(--emoji); font-size: calc(var(--ew, 92px) * .62); line-height: 1; }
  .clue .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .clue .q { display: flex; align-items: center; gap: 10px; font-size: var(--qs, 28px); font-weight: 800; line-height: 1.2; }
  .clue .q span.t { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tag { flex: none; padding: 3px 10px; border-radius: 10px; font-size: 18px; font-weight: 800; letter-spacing: .5px; }
  .tag.vi { background: rgba(239, 68, 68, .2); color: #fecaca; border: 1px solid rgba(239,68,68,.5); }
  .tag.en { background: rgba(59, 130, 246, .2); color: #bfdbfe; border: 1px solid rgba(59,130,246,.55); }
  .clue .ans { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: flex-start; }
  .clue .row2 { display: flex; align-items: center; gap: 14px; }
  .clue .who { flex: none; margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; border-radius: 999px;
    background: rgba(74, 222, 128, .18); color: #bbf7d0; font-size: 20px; font-weight: 800; max-width: 300px; }
  .clue.auto .who { background: rgba(148,163,184,.2); color: #cbd5e1; padding-left: 12px; }
  .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av { flex: none; width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #475569; display: grid; place-items: center; font-size: 18px; color: #fff; font-weight: 900; }

  /* ---------- dưới ---------- */
  #bottom { flex: none; display: flex; flex-direction: column; gap: 14px; }
  #feed { height: 54px; display: flex; gap: 10px; overflow: hidden; align-items: center; flex-wrap: nowrap; }
  .g { flex: none; padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); font-size: 22px; font-weight: 700; color: #e0e7ff; white-space: nowrap; animation: slidein .35s ease-out; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
  .g i { font-style: normal; color: var(--muted); font-weight: 600; }
  #chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { padding: 9px 16px; border-radius: 16px; background: rgba(0,0,0,.3); border: 1px solid var(--line); font-size: 22px; font-weight: 800; white-space: nowrap; }
  .chip .e { font-family: var(--emoji); margin-right: 6px; }
  .chip small { color: var(--gold); font-size: 20px; margin-left: 6px; }
  #likes { position: relative; height: 46px; border-radius: 23px; background: rgba(0,0,0,.35); border: 1px solid var(--line); overflow: hidden; }
  #likes i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #ec4899, #f43f5e); transition: width .5s ease; }
  #likes span { position: relative; display: flex; height: 100%; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; }
  #board { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #board .h { font-size: 22px; font-weight: 900; color: #fde68a; margin-right: 4px; }
  #board .p { display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; border-radius: 999px; background: rgba(251,191,36,.12); border: 1px solid rgba(251,191,36,.35); font-size: 20px; font-weight: 800; max-width: 300px; }
  #board .p span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board .p em { font-style: normal; color: var(--gold); }

  /* ---------- thông báo ---------- */
  #toasts { position: absolute; left: 0; right: 0; top: 600px; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; z-index: 5; }
  .toast { max-width: 960px; padding: 16px 30px; border-radius: 26px; font-size: 32px; font-weight: 900; text-align: center; color: #052e16;
    background: linear-gradient(180deg, #bbf7d0, #4ade80); box-shadow: 0 14px 40px rgba(0,0,0,.45); animation: toastin .5s cubic-bezier(.2, 1.4, .4, 1); display: flex; align-items: center; gap: 14px; }
  .toast.gold { color: #3b2300; background: linear-gradient(180deg, #fef3c7, #fbbf24); }
  .toast.blue { color: #0c1a4b; background: linear-gradient(180deg, #e0e7ff, #818cf8); }
  .toast.pink { color: #500724; background: linear-gradient(180deg, #fce7f3, #f472b6); }
  .toast .av { width: 52px; height: 52px; font-size: 24px; }
  .toast.out { animation: toastout .4s ease-in forwards; }

  /* ---------- cảm ơn quà ---------- */
  #thanks { position: absolute; left: 30px; top: 1250px; z-index: 6; display: flex; align-items: center; gap: 18px; padding: 16px 28px 16px 16px; border-radius: 30px;
    background: linear-gradient(135deg, #831843, #be185d 60%, #f472b6); border: 3px solid #fbcfe8; box-shadow: 0 16px 44px rgba(0,0,0,.5); transform: translateX(-120%); transition: transform .5s cubic-bezier(.2, 1.2, .4, 1); max-width: 900px; }
  #thanks.show { transform: translateX(0); }
  #thanks .av { width: 88px; height: 88px; font-size: 40px; border: 3px solid #fff; }
  #thanks .t1 { font-size: 26px; font-weight: 900; color: #fde68a; letter-spacing: 2px; }
  #thanks .t2 { font-size: 34px; font-weight: 900; max-width: 640px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #thanks .t3 { font-size: 24px; font-weight: 700; color: #fce7f3; }

  /* ---------- màn thắng / hết giờ / tạm dừng ---------- */
  .overlay { position: absolute; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center; background: rgba(5, 6, 22, .72); }
  .overlay.on { display: flex; animation: fadein .4s ease-out; }
  .card { width: 900px; padding: 46px 40px 40px; border-radius: 44px; text-align: center; background: linear-gradient(180deg, #1e1b4b, #0f0d2e); border: 4px solid var(--gold); box-shadow: 0 0 80px rgba(251,191,36,.35); animation: cardin .6s cubic-bezier(.2, 1.4, .4, 1); }
  .card h1 { margin: 0; font-size: 62px; font-weight: 900; color: #fde68a; line-height: 1.1; }
  .card .bigav { width: 170px; height: 170px; margin: 26px auto 10px; border-radius: 50%; border: 6px solid var(--gold); font-size: 80px; }
  .card .name { font-size: 46px; font-weight: 900; max-width: 820px; margin: 0 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub { margin-top: 8px; font-size: 28px; color: var(--muted); font-weight: 700; }
  .card .ph { margin: 28px 0 10px; font-size: 54px; font-weight: 900; line-height: 1.2; color: #fff; text-wrap: balance; }
  .card .mean { font-size: 28px; color: #c7d2fe; font-weight: 600; line-height: 1.4; text-wrap: balance; }
  .card .pts { margin-top: 22px; display: inline-block; padding: 10px 26px; border-radius: 999px; background: rgba(251,191,36,.18); border: 2px solid rgba(251,191,36,.6); color: #fde68a; font-size: 30px; font-weight: 900; }
  .card .next { margin-top: 22px; font-size: 26px; color: var(--muted); font-weight: 700; }
  #pause .card { border-color: var(--line); box-shadow: none; }
  #pause h1 { color: #e0e7ff; }
  #confetti { position: absolute; inset: 0; z-index: 9; pointer-events: none; }
  #soundBtn { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 10; display: none; padding: 18px 34px; border-radius: 999px; border: 0;
    font: 900 30px var(--font); color: #3b2300; background: var(--gold); cursor: pointer; }

  @keyframes pop { 0% { transform: scale(.4) rotate(-20deg); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes glow { 0%, 100% { filter: none; } 30% { filter: drop-shadow(0 0 18px #fbbf24) brightness(1.3); } }
  @keyframes rowpop { 0% { transform: scale(1); } 30% { transform: scale(1.04); box-shadow: 0 0 40px rgba(74,222,128,.6); } 100% { transform: scale(1); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes slidein { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  @keyframes toastin { from { opacity: 0; transform: translateY(-30px) scale(.8); } to { opacity: 1; transform: none; } }
  @keyframes toastout { to { opacity: 0; transform: translateY(-20px) scale(.9); } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes cardin { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div id="stage">
  <div id="top">
    <div id="logo"><span class="lock">🔐</span>GIẢI MÃ</div>
    <div id="kind">Câu bí ẩn</div>
    <div id="round"></div>
    <div id="timer">⏳ <span id="time">--:--</span></div>
  </div>

  <div id="main">
  <section id="phrase" class="panel">
    <div id="phraseTitle">CÂU BÍ ẨN</div>
    <div id="lines"></div>
    <div id="howto">💬 Bình luận <b>đáp án gợi ý</b> để mở chữ · đoán <b>cả câu</b> để thắng!</div>
  </section>

  <section id="clues" class="panel">
    <div id="cluesTitle">GỢI Ý · CÙNG SỐ = CÙNG CHỮ</div>
    <div id="clueList" style="display:contents"></div>
  </section>

  <div id="bottom">
    <div id="feed"></div>
    <div id="likes"><i></i><span>❤️ Thả tim mở chữ</span></div>
    <div id="chips"></div>
    <div id="board"></div>
  </div>
  </div>

  <div id="toasts"></div>
  <div id="thanks"><div class="av"></div><div><div class="t1">CẢM ƠN</div><div class="t2"></div><div class="t3"></div></div></div>

  <div id="win" class="overlay"><div class="card"></div></div>
  <div id="pause" class="overlay"><div class="card"></div></div>
  <canvas id="confetti" width="1080" height="1920"></canvas>
  <button id="soundBtn">🔊 Bật âm thanh</button>
</div>
<script type="module" src="js/giaima.js"></script>
<script type="module" src="js/goodbye.js"></script>
</body>
</html>
