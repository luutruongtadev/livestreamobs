# Build Docker image trên GitHub, chép sang VPS bằng SSH (user + mật khẩu) rồi chạy docker compose.
# Container chạy với restart: unless-stopped và Docker được bật cùng hệ thống,
# nên VPS tắt / mở lại thì app tự chạy lại.
#
# Cần tạo trong GitHub repo → Settings → Secrets and variables → Actions:
#   Secrets:   VPS_HOST, VPS_USER, VPS_PASSWORD, (tuỳ chọn) VPS_PORT, VPS_ENV_FILE
#   Variables: (tuỳ chọn) DEPLOY_MODE = phone | server | stream (mặc định phone), VPS_DIR (mặc định /opt/chua-online)
name: Deploy lên VPS

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ chạy trên VPS"
        type: choice
        options: [phone, server, stream]
        default: phone

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  DEPLOY_MODE: ${{ inputs.mode || vars.DEPLOY_MODE || 'phone' }}
  VPS_DIR: ${{ vars.VPS_DIR || '/opt/chua-online' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kiểm tra secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          missing=""
          for n in VPS_HOST VPS_USER VPS_PASSWORD; do
            if [ -z "${!n}" ]; then missing="$missing $n"; else echo "✓ $n có giá trị"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Thiếu hoặc trống secret:$missing. Tạo ở Settings → Secrets and variables → Actions → tab Secrets → New repository secret (không phải Environment / Codespaces / Dependabot), tên viết đúng chính xác."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Build image app
        run: |
          docker build --target app -t chua-online:app .
          docker save chua-online:app | gzip > image-app.tar.gz

      - name: Build image streamer (chỉ chế độ stream)
        if: env.DEPLOY_MODE == 'stream'
        run: |
          docker build --target streamer -t chua-online:streamer .
          docker save chua-online:streamer | gzip > image-streamer.tar.gz

      - name: Chuẩn bị file .env (từ secret VPS_ENV_FILE nếu có) + SIGN_API_KEY (secret riêng)
        env:
          VPS_ENV_FILE: ${{ secrets.VPS_ENV_FILE }}
          SIGN_API_KEY: ${{ secrets.SIGN_API_KEY }}
        run: |
          printf '%s' "$VPS_ENV_FILE" > env.deploy
          # SIGN_API_KEY lấy từ secret riêng trên GitHub, VPS tự ghi vào .env (đè giá trị cũ nếu có)
          printf '%s' "$SIGN_API_KEY" > sign.deploy
          chmod 600 env.deploy sign.deploy
          if [ -n "$SIGN_API_KEY" ]; then echo "✓ SIGN_API_KEY có giá trị"; else echo "SIGN_API_KEY trống → giữ giá trị trong .env trên VPS (nếu có)"; fi
          ls -lh image-*.tar.gz

      - name: Chép lên VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "image-*.tar.gz,env.deploy,sign.deploy,docker-compose.yml,.env.example,config.json,deploy/Caddyfile,deploy/remote-deploy.sh,public/assets"
          target: ${{ env.VPS_DIR }}
          overwrite: true

      # Dữ liệu (kho từ, điểm tuần, cache thuộc tính, giọng MC…) chuyển từ volume Docker "chua-data"
      # sang thư mục ./data ngay trên VPS để xem / sao lưu được. Chỉ chép MỘT lần (khi ./data còn trống);
      # volume cũ giữ nguyên làm bản dự phòng.
      - name: Chuyển dữ liệu từ volume Docker sang ./data trên VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 10m
          script: |
            set -eu
            DIR="${{ env.VPS_DIR }}"
            mkdir -p "$DIR/data" && cd "$DIR"
            DOCKER="docker"; docker info >/dev/null 2>&1 || DOCKER="sudo -n docker"
            if ! $DOCKER info >/dev/null 2>&1; then echo "Chưa có Docker (cài lần đầu) → bỏ qua"; exit 0; fi
            OLD_VOL="$($DOCKER volume ls -q | grep -E '(^|_)chua-data$' | head -1 || true)"
            if [ -z "$OLD_VOL" ]; then echo "Không có volume chua-data cũ → bỏ qua"; exit 0; fi
            if [ -n "$(ls -A data 2>/dev/null)" ]; then echo "./data đã có $(ls data | wc -l) mục → không chép lại"; exit 0; fi
            # dùng image app đang chạy để chép (không cần tải thêm); chưa có thì dùng alpine
            IMG="chua-online:app"; $DOCKER image inspect "$IMG" >/dev/null 2>&1 || IMG="alpine:3.20"
            echo "==> Dừng app, chép dữ liệu từ volume $OLD_VOL sang $DIR/data"
            $DOCKER compose stop app 2>/dev/null || $DOCKER stop "$($DOCKER ps -q --filter name=app)" 2>/dev/null || true
            $DOCKER run --rm --user root --entrypoint sh -v "$OLD_VOL":/from:ro -v "$DIR/data":/to "$IMG" \
              -c 'cp -a /from/. /to/ && chown -R 1000:1000 /to'
            echo "==> Đã chép $(ls data | wc -l) mục:"
            ls -la data

      - name: Chạy trên VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 20m
          script: bash "${{ env.VPS_DIR }}/deploy/remote-deploy.sh" "${{ env.VPS_DIR }}" "${{ env.DEPLOY_MODE }}"
