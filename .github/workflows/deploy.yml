# Build Docker image trên GitHub, chép sang VPS bằng SSH (user + mật khẩu) rồi chạy docker compose.
# Container chạy với restart: unless-stopped và Docker được bật cùng hệ thống,
# nên VPS tắt / mở lại thì app tự chạy lại.
#
# Cần tạo trong GitHub repo → Settings → Secrets and variables → Actions:
#   Secrets:   VPS_HOST, VPS_USER, VPS_PASSWORD, (tuỳ chọn) VPS_PORT, VPS_ENV_FILE,
#              (tuỳ chọn, ghi vào .env trên VPS) SIGN_API_KEY, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY
#   Variables: (tuỳ chọn) DEPLOY_MODE = phone | server | stream (mặc định phone), VPS_DIR (mặc định /opt/chua-online)
name: Deploy lên VPS

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ chạy trên VPS"
        type: choice
        options: [phone, server, stream]
        default: phone

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  DEPLOY_MODE: ${{ inputs.mode || vars.DEPLOY_MODE || 'phone' }}
  VPS_DIR: ${{ vars.VPS_DIR || '/opt/chua-online' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kiểm tra secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          missing=""
          for n in VPS_HOST VPS_USER VPS_PASSWORD; do
            if [ -z "${!n}" ]; then missing="$missing $n"; else echo "✓ $n có giá trị"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Thiếu hoặc trống secret:$missing. Tạo ở Settings → Secrets and variables → Actions → tab Secrets → New repository secret (không phải Environment / Codespaces / Dependabot), tên viết đúng chính xác."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Build image app
        run: |
          docker build --target app -t chua-online:app .
          docker save chua-online:app | gzip > image-app.tar.gz

      - name: Build image streamer (chỉ chế độ stream)
        if: env.DEPLOY_MODE == 'stream'
        run: |
          docker build --target streamer -t chua-online:streamer .
          docker save chua-online:streamer | gzip > image-streamer.tar.gz

      # Mỗi secret riêng dưới đây (nếu có giá trị) được VPS ghi vào .env, đè dòng cũ cùng tên.
      # Secret trống → giữ nguyên giá trị đang có trong .env trên VPS. Thêm secret mới: thêm vào env + danh sách KEYS.
      - name: Chuẩn bị file .env (từ secret VPS_ENV_FILE nếu có) + các secret riêng (SIGN_API_KEY, SUPABASE_*)
        env:
          VPS_ENV_FILE: ${{ secrets.VPS_ENV_FILE }}
          SIGN_API_KEY: ${{ secrets.SIGN_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          KEYS="SIGN_API_KEY SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY"
          printf '%s' "$VPS_ENV_FILE" > env.deploy
          : > secrets.deploy
          chmod 600 env.deploy secrets.deploy
          for n in $KEYS; do
            v="${!n}"
            v="${v%$'\r'}"; v="${v%$'\n'}"   # bỏ xuống dòng thừa khi dán
            if [ -z "$v" ]; then echo "· $n trống → giữ giá trị trong .env trên VPS (nếu có)"; continue; fi
            case "$v" in *$'\n'*) echo "::error::Secret $n chứa xuống dòng — dán lại đúng 1 dòng"; exit 1 ;; esac
            printf '%s=%s\n' "$n" "$v" >> secrets.deploy
            echo "✓ $n có giá trị"
          done
          ls -lh image-*.tar.gz

      # ssh / scp có sẵn trên runner + sshpass từ apt — không dùng appleboy/scp-action, appleboy/ssh-action
      # (mỗi lần chạy chúng tải file drone-scp / drone-ssh từ GitHub Releases, hay lỗi 504 làm hỏng cả lần deploy)
      - name: Cài sshpass
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get install -y -qq sshpass && break
            echo "apt lỗi, thử lại ($i)…"; sudo apt-get update -qq || true; sleep $((i * 5))
          done
          command -v sshpass

      - name: Chép lên VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          set -euo pipefail
          # tuỳ chọn chung; cổng truyền riêng: ssh dùng -p, scp dùng -P (với scp, -p nghĩa là giữ thời gian file)
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ConnectTimeout=30 -o LogLevel=ERROR"
          # đóng gói giữ nguyên đường dẫn (deploy/Caddyfile → $VPS_DIR/deploy/Caddyfile), ghi đè file cũ
          tar czf bundle.tar.gz image-*.tar.gz env.deploy secrets.deploy docker-compose.yml .env.example config.json deploy/Caddyfile deploy/remote-deploy.sh public/assets
          ls -lh bundle.tar.gz
          for i in 1 2 3; do
            if timeout 15m sshpass -e scp -P "$VPS_PORT" $OPTS bundle.tar.gz "$VPS_USER@$VPS_HOST:/tmp/chua-bundle.tar.gz" \
              || timeout 15m sshpass -e ssh -p "$VPS_PORT" $OPTS "$VPS_USER@$VPS_HOST" "cat > /tmp/chua-bundle.tar.gz" < bundle.tar.gz; then break; fi
            [ "$i" = 3 ] && { echo "::error::Không chép được lên VPS sau 3 lần"; exit 1; }
            echo "Chép lỗi, thử lại ($i)…"; sleep $((i * 10))
          done
          sshpass -e ssh -p "$VPS_PORT" $OPTS "$VPS_USER@$VPS_HOST" \
            "mkdir -p '${{ env.VPS_DIR }}' && tar xzf /tmp/chua-bundle.tar.gz -C '${{ env.VPS_DIR }}' && rm -f /tmp/chua-bundle.tar.gz && echo '✓ Đã chép lên ${{ env.VPS_DIR }}'"

      # Dữ liệu (kho từ, điểm tuần, cache thuộc tính, giọng MC…) chuyển từ volume Docker "chua-data"
      # sang thư mục ./data ngay trên VPS để xem / sao lưu được. Chỉ chép MỘT lần (khi ./data còn trống);
      # volume cũ giữ nguyên làm bản dự phòng.
      - name: Chuyển dữ liệu từ volume Docker sang ./data trên VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          set -euo pipefail
          timeout 10m sshpass -e ssh -p "$VPS_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ConnectTimeout=30 -o LogLevel=ERROR \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -eu
          DIR="${{ env.VPS_DIR }}"
          mkdir -p "$DIR/data" && cd "$DIR"
          DOCKER="docker"; docker info >/dev/null 2>&1 || DOCKER="sudo -n docker"
          if ! $DOCKER info >/dev/null 2>&1; then echo "Chưa có Docker (cài lần đầu) → bỏ qua"; exit 0; fi
          OLD_VOL="$($DOCKER volume ls -q | grep -E '(^|_)chua-data$' | head -1 || true)"
          if [ -z "$OLD_VOL" ]; then echo "Không có volume chua-data cũ → bỏ qua"; exit 0; fi
          if [ -n "$(ls -A data 2>/dev/null)" ]; then echo "./data đã có $(ls data | wc -l) mục → không chép lại"; exit 0; fi
          # dùng image app đang chạy để chép (không cần tải thêm); chưa có thì dùng alpine
          IMG="chua-online:app"; $DOCKER image inspect "$IMG" >/dev/null 2>&1 || IMG="alpine:3.20"
          echo "==> Dừng app, chép dữ liệu từ volume $OLD_VOL sang $DIR/data"
          $DOCKER compose stop app 2>/dev/null || $DOCKER stop "$($DOCKER ps -q --filter name=app)" 2>/dev/null || true
          $DOCKER run --rm --user root --entrypoint sh -v "$OLD_VOL":/from:ro -v "$DIR/data":/to "$IMG" \
            -c 'cp -a /from/. /to/ && chown -R 1000:1000 /to'
          echo "==> Đã chép $(ls data | wc -l) mục:"
          ls -la data
          REMOTE

      - name: Chạy trên VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          set -euo pipefail
          timeout 20m sshpass -e ssh -p "$VPS_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ConnectTimeout=30 -o LogLevel=ERROR \
            "$VPS_USER@$VPS_HOST" "bash '${{ env.VPS_DIR }}/deploy/remote-deploy.sh' '${{ env.VPS_DIR }}' '${{ env.DEPLOY_MODE }}'"
