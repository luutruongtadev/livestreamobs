name: Chẩn đoán VPS
# Chỉ đọc thông tin, KHÔNG deploy / KHÔNG khởi động lại app. Chạy khi push nhánh "diag".
on:
  push:
    branches: [diag]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Đọc tình trạng VPS + log app
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 8m
          script: |
            cd /opt/chua-online || exit 0
            DOCKER=docker; docker info >/dev/null 2>&1 || DOCKER="sudo -n docker"
            echo "===== TRẠNG THÁI APP ====="; curl -s -m 5 localhost:8686/api/status | grep -o '"state":"[^"]*"\|"drops":[0-9]*\|"delay":{[^}]*}[^}]*}}'
            echo "===== KẾT NỐI ĐO RIÊNG 90s: độ trễ TỪNG bình luận ====="
            $DOCKER exec chua-online-app-1 node --input-type=module -e '
              import { TikTokLiveConnection, WebcastEvent, ControlEvent } from "tiktok-live-connector";
              const t0 = Date.now(); const ds = []; const counts = {};
              const c = new TikTokLiveConnection("quehayhoi", { signApiKey: process.env.SIGN_API_KEY || undefined, processInitialData: false });
              for (const ev of ["chat","like","gift","member","roomUser","social"]) c.on(ev, (d) => { counts[ev] = (counts[ev]||0)+1;
                if (ev === "chat") { const ct = Number(d.common?.createTime); const ms = Date.now() - (ct < 1e12 ? ct*1000 : ct);
                  ds.push(ms); console.log(`chat +${((Date.now()-t0)/1000).toFixed(0)}s trễ=${(ms/1000).toFixed(1)}s "${String(d.content||"").slice(0,20)}"`); } });
              c.on(ControlEvent.DISCONNECTED, (i) => console.log("disconnected", JSON.stringify(i)));
              c.on(ControlEvent.ERROR, (e) => console.log("error", e?.info || e?.message));
              const st = await c.connect().catch((e) => { console.log("connect lỗi", e?.message); process.exit(0); });
              console.log("kết nối sau", ((Date.now()-t0)/1000).toFixed(1), "s, roomId", st?.roomId, "có SIGN_API_KEY:", !!process.env.SIGN_API_KEY);
              setTimeout(() => { ds.sort((a,b)=>a-b); const q=(p)=>ds.length?(ds[Math.min(ds.length-1,Math.floor(p*ds.length))]/1000).toFixed(1)+"s":"-";
                console.log("TỔNG:", JSON.stringify(counts), "| trung vị", q(0.5), "| p90", q(0.9), "| min", q(0), "| max", q(0.999));
                c.disconnect().finally(() => process.exit(0)); }, 90000);
            ' 2>&1 | tail -80
