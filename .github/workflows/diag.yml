name: Chẩn đoán VPS
# Chỉ đọc thông tin, KHÔNG deploy / KHÔNG khởi động lại app. Chạy khi push nhánh "diag".
on:
  push:
    branches: [diag]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Đọc tình trạng VPS + log app
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 8m
          script: |
            cd /opt/chua-online || exit 0
            DOCKER=docker; docker info >/dev/null 2>&1 || DOCKER="sudo -n docker"
            echo "===== ĐỒNG HỒ: VPS so với máy chủ TikTok / Google ====="
            date -u +"VPS:    %Y-%m-%d %H:%M:%S UTC"
            for u in https://www.tiktok.com/ https://www.google.com/; do echo "$u $(curl -sI -m 10 $u | grep -i '^date:')"; done
            timedatectl 2>/dev/null | grep -iE "synchronized|NTP|Time zone" || true
            echo "===== ĐỘ TRỄ THEO THỜI GIAN (đọc 5 lần, mỗi 20s) ====="
            for i in 1 2 3 4 5; do echo "$(date -u +%T) $(curl -s -m 5 localhost:8686/api/status | grep -o '"delay":{[^}]*}[^}]*}}' )"; sleep 20; done
            echo "===== SỐ SỰ KIỆN TIKTOK TRONG LOG 10 PHÚT ====="
            $DOCKER logs --since 10m chua-online-app-1 2>&1 | grep -c "connected" || true
            echo "===== TOP tiến trình trong container ====="
            $DOCKER top chua-online-app-1 -o pid,pcpu,pmem,args 2>/dev/null | head -5
